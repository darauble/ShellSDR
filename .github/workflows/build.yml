# Builds the x64 and arm64 release tarballs with the same container build as `tools/dev build`.
#   push to main          -> tarballs downloadable as workflow-run artifacts
#   tag release/vX.Y.Z    -> also attached to a GitHub Release named vX.Y.Z
name: build

on:
  push:
    branches: [main]
    tags: ['release/v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/release/v')
        run: |
          tag=${GITHUB_REF_NAME#release/v}
          ver=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag release/v$tag does not match Cargo.toml version $ver"
            exit 1
          fi

      # Registry + per-arch target dir used by tools/dev inside the container.
      - uses: actions/cache@v4
        with:
          path: |
            target/docker/cargo-home/registry
            target/docker/cargo-home/git
            target/docker/${{ matrix.arch }}
          key: docker-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'docker/Dockerfile.build') }}
          restore-keys: docker-${{ matrix.arch }}-

      - name: Build and pack
        run: tools/dev build release ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: shellsdr-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/release/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ver=${GITHUB_REF_NAME#release/}
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "ShellSDR $ver" --generate-notes
